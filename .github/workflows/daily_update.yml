name: Daily Data Update

# 매일 평일 KST 18:00 (UTC 09:00) 자동 실행
# 주의: GitHub cron은 최대 수분 지연될 수 있음 (보통 5~15분 이내)
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: batch/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r batch/requirements.txt

      - name: Run data pipeline
        run: python app.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git add data.json
            git commit -m "chore(data): auto update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M' 2>/dev/null || date +'%Y-%m-%d %H:%M')"
            git push
            echo "[ok] data.json committed & pushed"
          else
            echo "[skip] no changes in data.json"
          fi
